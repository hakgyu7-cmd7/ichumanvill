<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Shorts Pipeline Studio</title>
<style>
:root{--bg:#0a0d14;--panel:#111622;--card:#161c2c;--card2:#1b2236;--line:#232c42;--line2:#2f3b59;--tx:#e2e8f0;--mut:#94a3b8;--dim:#64748b;
 --g:#22c55e;--g2:#4ade80;--cy:#22d3ee;--pu:#a855f7;--am:#facc15;--rd:#f87171;--or:#fb923c}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#26334d;border-radius:9px}
.mono{font-family:"Fira Code",Consolas,monospace}
/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(10,13,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 20px}
.hrow{max-width:1800px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--g),var(--cy));display:grid;place-items:center;font-style:normal;font-size:20px;color:#000}
.logo b{font-size:16px}.logo small{display:block;color:var(--mut);font-size:11px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line2);color:var(--mut)}
.badge.g{color:var(--g2);border-color:#14532d;background:#052e16}.badge.a{color:var(--am);border-color:#713f12;background:#2a1f05}
.badge.r{color:var(--rd);border-color:#7f1d1d;background:#2c0f0f}.badge.c{color:var(--cy);border-color:#155e75;background:#08222b}.badge.p{color:#d8b4fe;border-color:#581c87;background:#1e0f33}
.metrics{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 6px;margin-left:auto}
.metric{padding:2px 12px;text-align:center;border-right:1px solid var(--line)}.metric:last-child{border:0}
.metric small{display:block;font-size:10px;color:var(--dim);text-transform:uppercase}.metric b{font-size:14px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:#1a2236;border-radius:9px;padding:6px 12px;font-size:12px;font-weight:600;transition:.15s}
.btn:hover{background:#243050}.btn.pri{background:linear-gradient(90deg,var(--g),var(--g2));color:#031;border:0}.btn.pri:hover{filter:brightness(1.1)}
.btn.cy{background:#0b3a4a;border-color:#155e75;color:#a5f3fc}.btn.pu{background:#2a1450;border-color:#581c87;color:#e9d5ff}
.btn.sm{padding:3px 9px;font-size:11px;border-radius:7px}.btn:disabled{opacity:.45;cursor:not-allowed}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--dim);margin-right:6px}.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}
/* stepper */
nav.steps{position:sticky;top:61px;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 20px}
.srow{max-width:1800px;margin:0 auto;display:flex;gap:6px;overflow-x:auto}
.step{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;background:var(--panel);border:1px solid var(--line);text-align:left}
.step:hover{border-color:var(--line2)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--card2);color:var(--mut);flex:none}
.step b{display:block;font-size:13px;line-height:1.2}.step small{color:var(--dim);font-size:11px}
.step.act{border-color:var(--g);background:#0b1f17}.step.act .n{background:var(--g);color:#031}
.step.ok .n{background:#14532d;color:var(--g2)}.step.warn .n{background:#713f12;color:var(--am)}
/* layout */
main{max-width:1800px;margin:0 auto;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:1100px){main{grid-template-columns:1fr}.metrics{margin-left:0}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.hint{color:var(--mut);font-size:12px;margin:2px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:800px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;font-weight:600;color:#cbd5e1;margin:8px 0 4px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g)}
textarea{resize:vertical;line-height:1.55}
textarea.mono,input.mono{font-size:12px}
input[type=checkbox]{accent-color:var(--g);width:15px;height:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.sub{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.note{border-left:3px solid var(--cy);background:#08222b;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12px;color:#bae6fd;margin:8px 0}
.note.w{border-color:var(--am);background:#2a1f05;color:#fde68a}.note.e{border-color:var(--rd);background:#2c0f0f;color:#fecaca}.note.g{border-color:var(--g);background:#052e16;color:#bbf7d0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);background:var(--card);font-size:12px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--g);background:#0b2a1a;color:var(--g2)}
/* trend items */
.titem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px}
.titem:hover{border-color:var(--line2)}.titem .t{flex:1;min-width:0}.titem .t b{display:block;font-weight:600;font-size:13px}.titem .t small{color:var(--dim)}
table.tb{width:100%;border-collapse:collapse;font-size:12px}table.tb th{color:var(--dim);text-align:left;font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}table.tb td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
/* scene cards */
.scene{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px}
.scene.cur{border-color:var(--g);box-shadow:0 0 0 1px #14532d}
.scene>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scene>summary::-webkit-details-marker{display:none}
.sn{width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--g2)}
.beat{display:grid;grid-template-columns:78px 1fr 44px;gap:8px;align-items:center;margin-top:6px}.beat small{color:var(--cy);font-size:11px}.beat .c{text-align:right;font-size:11px;color:var(--dim)}
.final{background:#0b1020;border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;font-size:11.5px;color:#cbd5e1;white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto}
.cutbox{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:var(--g);transition:.2s}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(34,197,94,.22);border-left:1px solid var(--g);border-right:1px solid var(--g)}
.iss{font-size:12px;padding:4px 0;display:flex;gap:6px}.iss.error{color:#fca5a5}.iss.warn{color:#fde68a}.iss.ok{color:#86efac}
.pre{background:#0b1020;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.chk .m{width:18px;text-align:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.tabs button.on{color:var(--g2);border-color:var(--g)}
.progress{height:12px;background:var(--card2);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--cy));width:0;transition:.3s}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:12px;text-align:center;color:var(--mut);font-size:12px;background:var(--card)}
.drop.hot{border-color:var(--g);color:var(--g2);background:#0b2a1a}
/* preview */
.sticky{position:sticky;top:132px}
.phone{width:270px;margin:6px auto 0;border:4px solid #334155;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.cv{position:relative;width:100%;aspect-ratio:9/16;background:#000;overflow:hidden;font-size:11px}
.cv .tb{position:absolute;left:0;right:0;top:0;height:12.5%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 6px}
.cv .tb span{color:#ffe500;font-weight:900;font-size:15px;line-height:1.2;text-shadow:0 0 2px #000,0 0 2px #000;white-space:pre-line}
.cv .vd{position:absolute;left:0;right:0;top:12.5%;height:66.667%;background:radial-gradient(circle at 50% 40%,#1f2d4d,#0b1224);overflow:hidden}
.cv .vd .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;opacity:.9}
.cv .vd .ct{position:absolute;left:5px;top:5px;font-size:9px;background:#08222bcc;color:#a5f3fc;border:1px solid #155e75;border-radius:5px;padding:1px 5px;max-width:92%}
.cv .vd .sf{position:absolute;border:2px solid rgba(74,222,128,.7);border-radius:5px;pointer-events:none;display:flex;align-items:flex-start;justify-content:center}
.cv .vd .sf.bad{border-color:rgba(251,146,60,.9)}.cv .vd .sf span{font-size:8px;background:#052e16cc;color:#86efac;padding:0 4px;border-radius:3px}
.cv .vd .pil{position:absolute;top:0;bottom:0;background:#000}
.cv .bt{position:absolute;left:0;right:0;bottom:0;height:20.833%;display:grid;place-items:center;color:#475569;font-size:9px;text-align:center;border-top:1px dashed #334155}
.cv .sb{position:absolute;left:0;right:0;bottom:21.875%;display:flex;flex-direction:column;align-items:center;transform:translateY(0)}
.cv .sb span{background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:12.5px;padding:1px 6px;line-height:1.35;margin-top:-1px}
.cv .g-off .sf,.cv.noguide .sf,.cv.noguide .bt{display:none}
.scrub{width:270px;margin:8px auto 0}
.scrub input[type=range]{width:100%;accent-color:var(--g)}
.toast{position:fixed;right:20px;bottom:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast div{background:#052e16;border:1px solid var(--g);color:#bbf7d0;padding:9px 14px;border-radius:11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:in .2s}
.toast div.w{background:#2a1f05;border-color:var(--am);color:#fde68a}.toast div.e{background:#2c0f0f;border-color:var(--rd);color:#fecaca}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
details.acc>summary{cursor:pointer;color:var(--cy);font-size:12px;font-weight:600;margin:6px 0}
.hide{display:none!important}
.seg{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on.ref{background:linear-gradient(90deg,#14532d,#0e7490);color:#fff}
.seg button.on.shop{background:linear-gradient(90deg,#92400e,#b45309);color:#fff}
a{color:var(--cy)}
</style>
</head>
<body>
<header class="top"><div class="hrow">
  <div class="logo"><i>⚡</i><div><b>AI Shorts Pipeline Studio <span class="badge g mono">v3.0</span></b><small>1.2x · 45초 · 6씬 · 방법 B(18컷) · Zero-Text · 1.06x 크롭</small></div></div>
  <div class="seg" id="mode-seg" title="제작 유형"></div>
  <div class="metrics">
    <div class="metric"><small>대본 분량</small><b id="m-chars" class="mono">0</b></div>
    <div class="metric"><small>예상 러닝타임</small><b id="m-run" class="mono">0.0초</b></div>
    <div class="metric"><small>Zero-Text</small><b id="m-zero" class="mono">-</b></div>
    <div class="metric" id="m-cta-wrap"><small>쇼핑 CTA</small><b id="m-cta" class="mono">-</b></div>
    <div class="metric"><small>클립</small><b id="m-clips" class="mono">-</b></div>
  </div>
  <div class="hbtns">
    <span class="badge" id="srv-badge"><span class="dot" id="srv-dot"></span><span id="srv-txt">서버 확인 중</span></span>
    <select id="sample-sel" class="btn" style="width:auto" title="샘플 불러오기"><option value="">샘플…</option></select>
    <button class="btn" data-act="newProject">새 프로젝트</button>
    <button class="btn" data-act="importJson">불러오기</button>
    <button class="btn" data-act="exportJson">내보내기</button>
    <button class="btn" data-act="saveServer" id="btn-save-srv" title="서버 projects/ 폴더에 저장">서버 저장</button>
    <input type="file" id="file-in" accept=".json" class="hide">
  </div>
</div></header>

<nav class="steps"><div class="srow" id="stepper"></div></nav>

<main>
  <div class="col" id="content"></div>
  <aside class="col sticky" id="side">
    <section class="card">
      <h3>📱 최종 화면 미리보기 <span class="sp"></span><button class="btn sm" data-act="toggleGuide">가이드</button></h3>
      <div class="hint" id="pv-info"></div>
      <div class="phone"><div class="cv" id="cv">
        <div class="tb"><span id="pv-title"></span></div>
        <div class="vd" id="pv-vd"><div class="ic" id="pv-ic"></div><div class="ct" id="pv-ct"></div><div class="sf" id="pv-sf"></div></div>
        <div class="bt">하단 400px · 쇼츠/릴스/틱톡<br>앱 UI 보호존 (검정 바)</div>
        <div class="sb" id="pv-sb"></div>
      </div></div>
      <div class="scrub">
        <div class="row sp"><span class="mono" id="pv-time" style="font-size:11px">0.0s / 45.0s</span><span class="row"><button class="btn sm" data-act="pvPlay" id="pv-play">▶ 재생</button></span></div>
        <input type="range" id="pv-range" min="0" max="44.9" step="0.1" value="0">
        <div class="row" id="pv-scenes" style="margin-top:6px;gap:4px"></div>
      </div>
    </section>
    <section class="card"><h3>✅ 프로젝트 점검 <span class="sp"></span><span id="iss-count" class="badge"></span></h3><div id="issues"></div></section>
  </aside>
</main>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="pipeline_core.js"></script>
<script>
'use strict';
/* =====================================================================================
   AI Shorts Pipeline Studio v3 - 영상 제작 순서(소재 → 대본 → 이미지·영상 → 음성 → 합성 → 메타데이터)
   규칙/템플릿은 config.js(=config.json) + pipeline_core.js(=prompt_engine.py 와 동일 로직) 에서만 가져온다.
   ===================================================================================== */
const CFG = window.PIPELINE_CONFIG, SEED = window.PIPELINE_SEED, SAMPLES = window.PIPELINE_SAMPLES, Core = window.PipelineCore;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const p2 = (n) => String(n).padStart(2, '0');
const LS = 'shorts_pipeline_v3';
const mode = () => (Core.isShopping(P, CFG) ? 'shopping' : 'reference');
function stepList() {
  const shop = mode() === 'shopping';
  return [
    { id: 'source', label: shop ? '소재 발굴' : '레퍼런스', sub: shop ? '쿠팡·틱톡 상품 · 떡상' : '떡상 링크 → 대본 추출', icon: '🔎' },
    { id: 'script', label: shop ? '기획 · 대본' : '새 대본', sub: shop ? 'CTA 포함 6씬' : '역설계 → 새 주제 6씬', icon: '✍️' },
    { id: 'assets', label: '기준 이미지', sub: '인물·사물 분석 → 일관성', icon: '🧬' },
    { id: 'visual', label: '이미지 · 영상', sub: 'Google Flow / Omni 1.2', icon: '🎬' },
    { id: 'audio', label: '음성', sub: 'TTS · 1.2배속 · 무음 제거', icon: '🎙️' },
    { id: 'render', label: '합성', sub: '레터박스 · 자막 · 렌더', icon: '🎞️' },
    { id: 'meta', label: '메타데이터', sub: '3대 플랫폼 · 4개국어', icon: '🌐' }
  ];
}
const ICONS = ['🔥', '💥', '🔧', '⚡', '🔄', '🛒'];
const SHOP_PIN = {
  ko: { youtube: '🔥 영상 속 상품은 [하단 쇼핑 태그]와 이 고정 댓글 링크에서 확인하세요! 👇', instagram: '🛍️ 구매 정보: 프로필 링크에서 확인해 주세요!', tiktok: '좌측 하단 [노란색 장바구니]를 눌러 확인하세요! 🛒' },
  en: { youtube: '🛒 Find the product via the shopping tag below and the pinned link! 👇', instagram: '🛍️ Tap the link in bio to shop!', tiktok: '🛒 Tap the yellow cart at the bottom left!' },
  ja: { youtube: '🛒 動画内の商品は画面下のショッピングタグと固定コメントのリンクから！👇', instagram: '🛍️ プロフィールのリンクからチェック！', tiktok: '🛒 左下の黄色いカートからチェック！' },
  zh: { youtube: '🛒 點擊下方購物標籤或置頂留言連結查看商品！👇', instagram: '🛍️ 點擊主頁連結查看商品！', tiktok: '🛒 點擊左下角黃色購物車查看！' }
};

let P;                       // 현재 프로젝트
const S = {                  // UI/세션 상태 (프로젝트 파일에는 저장하지 않음)
  tab: 'source', server: null, files: null, status: null, trends: null, outliers: null, trendSrc: { coupang: true, tiktok: true, reddit: true },
  redditCat: 'general', manual: [], busy: {}, metaLang: 'ko', metaPlat: 'youtube', metaLangs: { ko: true, en: false, ja: false, zh: false },
  pvScene: 0, pvT: 0, pvTimer: null, guides: true, job: null, ytKey: '', claudeReply: '', metaReply: '', ttsMode: 'beats', openScenes: { 0: true }
};

/* ------------------------------------------------------------------ utils */
function toast(msg, kind) {
  const d = document.createElement('div'); d.textContent = msg; if (kind) d.className = kind;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), kind === 'e' ? 6000 : 2600);
}
function copyText(text, msg) {
  const done = () => toast(msg || '클립보드에 복사했습니다.');
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
    try { document.execCommand('copy') ? done() : toast('복사 실패 - 직접 선택해 복사하세요', 'w'); } catch (e) { toast('복사 실패', 'w'); } t.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* ------------------------------------------------------------------ router / render */
const TABS = { source: tabSource, script: tabScript, assets: tabAssets, visual: tabVisual, audio: tabAudio, render: tabRender, meta: tabMeta };
function renderTab() { $('#content').innerHTML = TABS[S.tab](); const f = LIVE[S.tab]; if (f) f(); }
function renderMode() { const sh = mode() === 'shopping'; $('#mode-seg').innerHTML = `<button class="ref ${sh ? '' : 'on'}" data-act="setMode" data-m="reference">🎬 레퍼런스 쇼츠</button><button class="shop ${sh ? 'on' : ''}" data-act="setMode" data-m="shopping">🛒 쇼핑 쇼츠</button>`; $('#m-cta-wrap').classList.toggle('hide', !sh); }
function renderAll() { renderMode(); renderStepper(); renderTab(); renderMetrics(); renderIssues(); renderPreview(); }
function gotoTab(id) { S.tab = id; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); if (['assets', 'visual', 'render', 'audio'].includes(id)) refreshFiles(); }

/* ------------------------------------------------------------------ server calls */
async function detectServer() {
  if (location.protocol === 'file:') { S.server = false; paintServer(); return; }
  try { S.status = await api('/api/status'); S.server = true; } catch (e) { S.server = false; }
  paintServer(); if (S.server) refreshFiles(true);
}
function paintServer() {
  $('#srv-dot').className = 'dot' + (S.server ? ' on' : ''); $('#srv-txt').textContent = S.server ? '서버 연결됨' : (location.protocol === 'file:' ? '오프라인 (python server.py 로 실행하면 전체 기능)' : '서버 없음');
  $('#btn-save-srv').classList.toggle('hide', !S.server); renderTab();
}
async function refreshFiles(silent) {
  if (!S.server) return;
  try { S.files = await api('/api/files'); } catch (e) { if (!silent) toast(e.message, 'e'); return; }
  renderMetrics(); renderStepper();
  if (['assets', 'visual', 'audio', 'render'].includes(S.tab)) { const y = window.scrollY; renderTab(); window.scrollTo(0, y); }
}
async function uploadFile(kind, file, scene, id) {
  if (!file) return;
  toast(`${file.name} 업로드 중… (${(file.size / 1048576).toFixed(1)}MB)`);
  try {
    const q = `kind=${kind}&name=${encodeURIComponent(file.name)}` + (scene !== undefined ? `&scene=${scene + 1}` : '') + (id ? `&id=${encodeURIComponent(id)}` : '');
    const r = await fetch('/api/upload?' + q, { method: 'POST', body: file, headers: { 'Content-Type': 'application/octet-stream' } });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    toast(`저장됨: ${j.saved}`); await refreshFiles();
  } catch (e) { toast('업로드 실패: ' + e.message, 'e'); }
}
async function pollRender() {
  try { S.job = await api('/api/render/status'); } catch (e) { return; }
  if (S.tab === 'render') { const b = $('#rd-bar'), l = $('#rd-log'); if (b) b.style.width = Math.round(S.job.progress * 100) + '%'; if (l) { l.textContent = (S.job.log || []).join('\n') + (S.job.error ? '\n[오류] ' + S.job.error : ''); l.scrollTop = l.scrollHeight; } }
  if (S.job.state === 'running') setTimeout(pollRender, 700);
  else { await refreshFiles(true); if (S.job.state === 'done') toast('렌더링 완료!'); else if (S.job.state === 'error') toast('렌더 실패 - 로그 확인', 'e'); renderTab(); renderStepper(); }
}

    let n = 0; Object.keys(CFG.languages).forEach((l) => { if (data[l]) Object.keys(CFG.platforms).forEach((p) => { if (data[l][p]) { (P.metadata[l] = P.metadata[l] || {})[p] = Object.assign({ title: '', caption: '', pinned: '' }, data[l][p]); n++; } }); });
    toast(`${n}개 항목 적용`); save(); renderAll();
  },
  fillShopPin: () => { Object.keys(CFG.languages).forEach((l) => Object.keys(CFG.platforms).forEach((p) => { const m = ((P.metadata[l] = P.metadata[l] || {})[p] = Object.assign({ title: '', caption: '', pinned: '' }, (P.metadata[l] || {})[p])); if (!m.pinned) m.pinned = SHOP_PIN[l][p]; })); toast('빈 고정댓글에 쇼핑 문구를 채웠습니다.'); save(); renderTab(); },
  metaLang: (d) => { S.metaLang = d.k; renderTab(); },
  metaPlat: (d) => { S.metaPlat = d.k; renderTab(); },
  copyMeta: (d) => { const m = ((P.metadata[S.metaLang] || {})[S.metaPlat]) || {}; copyText(m[d.k] || '', '복사했습니다.'); }
};

/* ------------------------------------------------------------------ events (delegation) */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b.dataset); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.bind) {
    let v = t.value; if (t.dataset.num !== undefined) v = parseFloat(v) || 0;
    setPath(P, t.dataset.bind, v);
    if (t.dataset.bind === 'meta.top_title') $$('[data-bind="meta.top_title"]').forEach((x) => { if (x !== t) x.value = v; });
    refreshDerived();
  } else if (t.dataset.meta) {
    const m = ((P.metadata[S.metaLang] = P.metadata[S.metaLang] || {})[S.metaPlat] = Object.assign({ title: '', caption: '', pinned: '' }, (P.metadata[S.metaLang] || {})[S.metaPlat]));
    m[t.dataset.meta] = t.value; if (t.dataset.meta === 'title') { const c = $('#mt-c1'); if (c) c.textContent = t.value.length + '자'; } save(); renderStepper();
  } else if (t.id === 'vs-v' || t.id === 'vs-s') {
    const v = +$('#vs-v').value, s = +$('#vs-s').value, o = $('#vs-out');
    if (v > 0 && s > 0) { const r = (v / s).toFixed(1), g = r >= 10 ? '🔥 초특급 타깃' : r >= 5 ? '👍 1차 후보' : r >= 1 ? '보통' : '제외'; o.textContent = `${r}배 ${g}`; } else o.textContent = '-';
  } else if (t.id === 'claude-reply') S.claudeReply = t.value; else if (t.id === 'meta-reply') S.metaReply = t.value; else if (t.id === 'ol-key') { S.ytKey = t.value; save(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.bind && (t.tagName === 'SELECT' || t.dataset.re !== undefined)) {
    setPath(P, t.dataset.bind, t.dataset.num !== undefined ? parseFloat(t.value) || 0 : t.value);
    if (t.dataset.bind === 'meta.category2' && t.value === P.meta.category) P.meta.category2 = '';
    save(); renderAll();
  } else if (t.dataset.check) {
    if (t.dataset.check === 'progress_voice') { S.localVoice = t.checked; return; }
    const path = t.dataset.check; const ks = path.split('.');
    if (ks[0] === 'scenes' && ks[2] === 'done') { const sc = P.scenes[+ks[1]]; sc.done = sc.done || {}; sc.done[ks[3]] = t.checked; save(); renderStepper(); const sum = t.closest('details'); if (sum) { const i = +ks[1]; S.openScenes[i] = true; } return; }
    setPath(P, path, t.checked); save(); renderAll();
  } else if (t.dataset.ref) {
    const [ai, si] = t.dataset.ref.split(':').map(Number), id = P.assets[ai].id, sc = P.scenes[si];
    sc.refs = t.checked ? (sc.refs.includes(id) ? sc.refs : sc.refs.concat([id])) : sc.refs.filter((r) => r !== id);
    save(); const y = window.scrollY; renderAll(); window.scrollTo(0, y);
  } else if (t.dataset.src) { S.trendSrc[t.dataset.src] = t.checked; renderTab(); }
  else if (t.id === 'reddit-cat') { S.redditCat = t.value; S.trends = null; renderTab(); }
  else if (t.dataset.mlang) { S.metaLangs[t.dataset.mlang] = t.checked; save(); renderTab(); }
  else if (t.name === 'ttsm') { S.ttsMode = t.value; renderTab(); }
  else if (t.dataset.upload) { uploadFile(t.dataset.upload, t.files[0], t.dataset.i !== undefined ? Number(t.dataset.i) : undefined, t.dataset.id); t.value = ''; }
  else if (t.id === 'file-in') importFile(t.files[0], t);
  else if (t.id === 'sample-sel') { if (t.value && confirm('샘플을 불러오면 현재 프로젝트가 대체됩니다. 계속할까요?')) { setProject(clone(SAMPLES[t.value])); toast('샘플을 불러왔습니다.'); } t.value = ''; }
});
document.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.scene !== undefined) S.openScenes[d.dataset.scene] = d.open; }, true);
['dragover', 'dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => {
  const z = e.target.closest('[data-drop],[data-drop-voice],[data-drop-ref]'); if (!z) return;
  e.preventDefault(); z.classList.toggle('hot', ev === 'dragover');
  if (ev === 'drop') { const f = e.dataTransfer.files[0]; if (z.dataset.drop !== undefined) uploadFile('clip', f, Number(z.dataset.drop)); else if (z.dataset.dropRef !== undefined) uploadFile('ref', f, undefined, z.dataset.dropRef); else uploadFile(z.dataset.dropVoice, f); }
}));
document.addEventListener('keydown', (e) => { if (e.target.id === 'ol-q' && e.key === 'Enter') ACT.searchOutliers(); });

function importFile(file, input) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      let j = JSON.parse(rd.result);
      if (!j || !Array.isArray(j.scenes)) throw new Error('scenes 배열이 없는 JSON 입니다.');
      if (!j.meta && (j.topic !== undefined || j.topTitle !== undefined)) j = convertLegacy(j);   // v2(제미나이 대시보드) 내보내기 호환
      setProject(j); toast('프로젝트를 불러왔습니다.');
    } catch (err) { toast('불러오기 실패: ' + err.message, 'e'); }
    input.value = '';
  };
  rd.readAsText(file);
}
function splitEvenly(text) {
  const w = text.trim().split(/\s+/); if (w.length < 3) return [text.trim(), '', ''];
  const per = Math.ceil(w.length / 3); return [0, 1, 2].map((k) => w.slice(k * per, (k + 1) * per).join(' '));
}
function convertLegacy(j) {   // 제미나이가 만든 v2.6 대시보드 JSON -> v3
  const p = Core.defaultProject(CFG);
  Object.assign(p.meta, { topic: j.topic || '', top_title: j.topTitle || '', style: j.selectedStyle || p.meta.style });
  p.options.zero_text = j.zeroTextEnabled !== false; p.options.safe_margin = j.safeMarginEnabled !== false;
  p.scenes = j.scenes.map((s, i) => ({ id: i + 1, beats: Array.isArray(s.beats) ? s.beats : splitEvenly(s.script || ''),
    frame1: '', frame2: '', cuts: (s.angles || []).slice(0, 3).map((a) => ({ type: a.type || '', prompt: a.prompt || '' })) }));
  if (j.metadata) p.metadata = j.metadata;
  toast('v2 대시보드 JSON 을 변환했습니다. Frame1/Frame2 프롬프트와 비트 분할은 직접 확인하세요.', 'w');
  return p;
}

/* ------------------------------------------------------------------ boot */
(function boot() {
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { /* ignore */ }
  if (saved && saved.project) { P = Core.normalizeProject(saved.project, CFG); S.ytKey = saved.ytKey || ''; if (saved.metaLangs) S.metaLangs = saved.metaLangs; }
  else P = Core.normalizeProject(clone(SAMPLES.ramen_bgrade || {}), CFG);
  P = fixShape(P);
  $('#sample-sel').innerHTML = '<option value="">샘플…</option>' + Object.entries(SAMPLES).map(([k, s]) => `<option value="${k}">${esc(s.meta.topic)}</option>`).join('');
  initPreview(); renderAll(); detectServer();
})();
</script>
</body>
