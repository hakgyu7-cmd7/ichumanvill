function initCloudSync() {
  if (!db) return;
  db.collection('pending').onSnapshot(s => {
    pending = s.docs.map(d => ({ docId: d.id, ...d.data() }));
    save('pending', pending);
    if (tab === 'admin') go('admin', false);
  }, err => console.log(err));

  db.collection('approved').onSnapshot(s => {
    approved = s.docs.map(d => ({ docId: d.id, ...d.data() }));
    save('approved', approved);
    if (user) {
      const me = approved.find(u => u.nick === user.nick);
      if (me && me.role !== user.role) {
        user.role = me.role;
        save('user', user);
        renderTop();
      }
    }
  }, err => console.log(err));

  db.collection('chat').orderBy('ts', 'asc').limitToLast(100).onSnapshot(s => {
    if (!s.empty) {
      chat = s.docs.map(d => ({ docId: d.id, ...d.data() }));
      save('chat', chat);
      if (tab === 'chat') {
        const c = $('chatlog');
        if (c) { c.innerHTML = chat.map(bubble).join(''); c.scrollTop = c.scrollHeight; }
      }
    }
  }, err => console.log(err));

  const syncBoard = (col, localArr, key) => {
    db.collection(col).orderBy('id', 'desc').limit(50).onSnapshot(s => {
      if (!s.empty) {
        const list = s.docs.map(d => ({ docId: d.id, ...d.data() }));
        if (col === 'notices') notices = list;
        else if (col === 'res') resolutions = list;
        else if (col === 'comp') complaints = list;
        else if (col === 'comm') communities = list;
        else if (col === 'shop') shops = list;
        save(key, list);
        if (tab === 'home' || tab === col || (col==='comm' && tab==='community')) go(tab, false);
      }
    }, err => console.log(err));
  };

  syncBoard('notices', notices, 'notices');
  syncBoard('res', resolutions, 'res');
  syncBoard('comp', complaints, 'comp');
  syncBoard('comm', communities, 'comm_posts');
  syncBoard('shop', shops, 'shop_posts');
}

const card = (t, p) => {
  const allowed = (t !== 'comp') || canReadComplaint(p);
  const secretBadge = p.isSecret ? '<span class="text-amber-600 font-bold mr-1">🔒 비공개</span>' : '';

  return `<button onclick="detail('${t}',${p.id})" class="w-full text-left bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-3 active:bg-slate-50">
    <div class="flex justify-between text-[11px] text-slate-400 mb-1">

    <h3 class="font-bold text-sm text-slate-900 mb-1">${esc(p.title)}</h3>
    <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${contentPreview}</p>
    <p class="text-[11px] text-slate-400 mt-2">${esc(p.author)} · 댓글 ${(p.comments || []).length}</p>
  </button>`;
};

const list = t => { const it = arr(t); return it.length ? it.map(p => card(t, p)).join('') : empty; };

  history.pushState({ sheet: true }, '');
}

function closeSheet(byBack = false) {
  if (!$('sheet').classList.contains('hidden')) {$('sheet').classList.add('hidden');
    if (!byBack && history.state && history.state.sheet) history.back();
  }
}

window.addEventListener('popstate', e => {
  if (!$('sheet').classList.contains('hidden')) { closeSheet(true); return; }
  if (e.state && e.state.t) go(e.state.t, false);
  else go('home', false);
});

function readImg(f, cb) {
  if (!f) return cb(null);
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 600 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width * s; c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.6));
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}

  openSheet('메시지 메뉴', `<div class="space-y-2">
    <button onclick="replyId=${id};closeSheet();go('chat')" class="w-full py-3 rounded-xl bg-slate-100 font-bold text-sm">↪ 답장</button>
    <button onclick="copyMsg(${id})" class="w-full py-3 rounded-xl bg-slate-100 font-bold text-sm">📋 복사</button>
    ${canDel ? `<button onclick="delMsg(${id})" class="w-full py-3 rounded-xl bg-red-50 text-red-600 font-bold text-sm">🗑 삭제</button>` : ''}
  </div>`);
}
function copyMsg(id) { const m = chat.find(x => x.id === id); navigator.clipboard?.writeText(m.text); closeSheet(); }
function delMsg(id) {
  if (!confirm('이 메시지를 삭제할까요?')) return;
  const m = chat.find(x => x.id === id);
  if (db && m && m.docId) db.collection('chat').doc(m.docId).delete();
  chat = chat.filter(x => x.id !== id); save('chat', chat); closeSheet(); go('chat');
}
function sendChat(e) {
  e.preventDefault();
  const txt = e.target.elements.m.value.trim(); if (!txt) return false;
  const rp = replyId && chat.find(m => m.id === replyId);
  const newMsg = { id: Date.now(), nick: user.nick, text: txt, time: hm(), ts: Date.now(), reply: rp ? { nick: rp.nick, text: rp.text } : null };
  if (db) db.collection('chat').add(newMsg);
  chat.push(newMsg); if (chat.length > 200) chat = chat.slice(-200);
  replyId = null; save('chat', chat); go('chat');
  return false;
}

function detail(t, id) {
  const p = arr(t).find(x => x.id === id); if (!p) return;
  if (t === 'comp' && !canReadComplaint(p)) {
    alert('비공개 건의글입니다. 작성자와 관리자만 볼 수 있습니다.');
    return;
  }
  const cm = p.comments || [];
  const mine = user && (isAdmin() || user.nick === p.author);
  let st = '';
  if (t === 'comm' && mine) {
    st = `<select onchange="setCommStatus(${id},this.value)" class="${IN} mb-3 font-bold text-xs">
      <option ${p.status === '진행중' ? 'selected' : ''}>진행중</option>
      <option ${p.status === '나눔완료' ? 'selected' : ''}>나눔완료</option>
      <option ${p.status === '모집완료' ? 'selected' : ''}>모집완료</option>
    </select>`;
  } else if (t === 'comp' && isCouncil()) {
    st = `<select onchange="setStatus(${id},this.value)" class="${IN} mb-3 font-bold text-xs">${['접수완료', '검토중', '반영완료'].map(s => `<option ${p.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`;
  }

  openSheet(esc(p.title), `
    <div class="flex justify-between items-center text-xs text-slate-400 mb-3">
      <span>${esc(p.date)} · ${esc(p.author)} ${p.isSecret ? '· 🔒 비공개' : ''}</span>
      ${p.status ? `<span class="px-2 py-0.5 rounded font-bold bg-blue-100 text-blue-800 text-[11px]">${p.status}</span>` : ''}
    </div>
    ${p.img ? `<img src="${p.img}" class="w-full rounded-xl mb-3">` : ''}
    <p class="text-sm whitespace-pre-wrap leading-relaxed mb-4">${esc(p.content)}</p>
    ${st}
    ${mine ? `<button onclick="delPost('${t}',${id})" class="text-xs text-red-600 font-bold mb-4">이 글 삭제</button>` : ''}
    <h4 class="text-xs font-bold mb-2">댓글 ${cm.length}</h4>
    <div class="space-y-2 mb-3">${cm.map(c => `<div class="bg-slate-50 rounded-xl p-2.5 text-xs"><b>${esc(c.author)}</b> <span class="text-slate-400">${esc(c.time)}</span><p class="mt-1">${esc(c.text)}</p></div>`).join('') || '<p class="text-xs text-slate-400">등록된 댓글이 없습니다.</p>'}</div>
    ${user ? `<form onsubmit="return addComment(event,'${t}',${id})" class="flex gap-2"><input name="c" required class="${IN}" placeholder="댓글 입력"><button class="px-4 rounded-xl bg-blue-700 text-white text-sm font-bold shrink-0">등록</button></form>` : '<button onclick="login()" class="w-full py-2.5 rounded-xl bg-slate-100 text-xs font-bold text-blue-700">로그인하고 댓글 남기기</button>'}`);
}

function addComment(e, t, id) {
  e.preventDefault();
  const v = e.target.elements.c.value.trim(); if (!v) return false;
  const p = arr(t).find(x => x.id === id);
  const newCm = { author: user.nick, text: v, time: today() + ' ' + hm() };
  p.comments = (p.comments || []).concat(newCm);
  if (db && p.docId) db.collection(t === 'comm' ? 'comm' : (t === 'shop' ? 'shop' : t)).doc(p.docId).update({ comments: p.comments });
  save(t === 'comm' ? 'comm_posts' : (t === 'shop' ? 'shop_posts' : t), arr(t));
  detail(t, id);
  return false;
}

function delPost(t, id) {
  if (!confirm('삭제하시겠습니까? 복구할 수 없습니다.')) return;
  const a = arr(t);
  const p = a.find(x => x.id === id);
  if (db && p && p.docId) db.collection(t === 'comm' ? 'comm' : (t === 'shop' ? 'shop' : t)).doc(p.docId).delete();
  a.splice(a.findIndex(x => x.id === id), 1);
  save(t === 'comm' ? 'comm_posts' : (t === 'shop' ? 'shop_posts' : t), a);
  closeSheet(); go(tab);
}

function setStatus(id, v) {
  const c = complaints.find(x => x.id === id);
  if (c) { c.status = v; if (db && c.docId) db.collection('comp').doc(c.docId).update({ status: v }); save('comp', complaints); }
}
function setCommStatus(id, v) {
  const c = communities.find(x => x.id === id);
  if (c) { c.status = v; if (db && c.docId) db.collection('comm').doc(c.docId).update({ status: v }); save('comm_posts', communities); }
}

function openWrite(t) {
  if (!user) {
    alert('게시글 작성은 입주민 로그인 후 이용 가능합니다.');
    return login();
  }
  let extra = '';
  if (t === 'notice') extra = `<select name="cat" class="${IN}"><option>관리사무소</option><option>입주자대표회의</option></select>`;
  else if (t === 'res') extra = `<input name="sub" required class="${IN}" placeholder="회차 (예: 제24차 정기회의)">`;
  else if (t === 'comm') extra = `<select name="cat" class="${IN}"><option>무료나눔</option><option>소모임</option><option>재능기부</option><option>공동체봉사</option></select>`;
  else if (t === 'shop') extra = `<select name="cat" class="${IN}"><option>식당/카페</option><option>생활/세탁/마트</option><option>인테리어/시공/청소</option><option>학원/과외/예체능</option><option>기타서비스</option></select>`;

  const secretOpt = t === 'comp' ? `<label class="flex items-center gap-2 text-xs font-bold text-slate-700 bg-slate-50 p-2.5 rounded-xl border border-slate-200"><input type="checkbox" name="secret"> 🔒 비공개로 접수 (작성자와 관리자만 열람)</label>` : '';
  const img = `<label class="text-xs font-bold block">사진 첨부 (선택)</label><input type="file" name="img" accept="image/*" class="text-xs">`;
  openSheet(TITLE[t], `<form onsubmit="return submitWrite(event,'${t}')" class="space-y-3">${extra}<input name="ttl" required class="${IN}" placeholder="제목"><textarea name="body" rows="5" required class="${IN}" placeholder="내용을 작성해주세요."></textarea>${secretOpt}${img}<button class="${BTN}">등록</button></form>`);
}

function submitWrite(e, t) {
  e.preventDefault();
  const g = n => e.target.elements[n];
  const rec = { id: Date.now(), title: g('ttl').value.trim(), content: g('body').value.trim(), date: today(), author: user.nick, comments: [] };
  if (t === 'notice' || t === 'comm' || t === 'shop') rec.cat = g('cat').value;
  if (t === 'res') rec.sub = g('sub').value.trim();
  if (t === 'comp') { rec.status = '접수완료'; rec.isSecret = !!g('secret')?.checked; }
  if (t === 'comm') rec.status = '진행중';

  readImg(g('img')?.files[0], img => {
    if (img) rec.img = img;
    const col = (t === 'comm') ? 'comm' : (t === 'shop' ? 'shop' : t);
    if (db) db.collection(col).add(rec);
    arr(t).unshift(rec);
    save(t === 'comm' ? 'comm_posts' : (t === 'shop' ? 'shop_posts' : t), arr(t));
    closeSheet(); go(tab);
  });
  return false;
}

function login() {
  openSheet('로그인', `<form onsubmit="return doLogin(event)" class="space-y-3">
    <input name="uid" required class="${IN}" placeholder="닉네임 또는 관리사무소">
    <input name="upw" type="password" required class="${IN}" placeholder="비밀번호">
    <button class="${BTN}">로그인</button></form>
    <button onclick="register()" class="w-full mt-3 text-sm font-bold text-blue-700 py-2">입주민 가입신청 →</button>`);
}

function doLogin(e) {
  e.preventDefault();
  const g = n => e.target.elements[n];
  const id = g('uid').value.trim(), pw = g('upw').value.trim();
  if (id === ADMIN.id && pw === ADMIN.pw) {
    user = { role: 'admin', nick: ADMIN.id, name: '관리사무소', dongHo: '관리본부' };
  } else {
    const f = approved.find(u => u.nick === id && u.pw === pw);
    if (!f) {
      alert(pending.some(u => u.nick === id) ? '승인 대기 중인 계정입니다.' : '아이디 또는 비밀번호가 맞지 않습니다.');
      return false;
    }
    user = { nick: f.nick, name: f.name, dongHo: f.dongHo, phone: f.phone, role: f.role };
  }
  save('user', user); closeSheet(); renderTop(); go(tab);
  return false;
}

function register() {
  openSheet('입주민 가입신청', `<form onsubmit="return submitRegister(event)" class="space-y-3 text-sm">
    <input name="nick" required class="${IN}" placeholder="활동 닉네임 (실명 대신 표시)">
    <div class="grid grid-cols-2 gap-2"><select name="dong" class="${IN}">${[101,102,103,104,105,106,107,108].map(d => `<option>${d}동</option>`).join('')}</select><input name="ho" required class="${IN}" placeholder="호수 (예: 1204)"></div>
    <input name="name" required class="${IN}" placeholder="실거주자 성함">
    <input name="phone" type="tel" required class="${IN}" placeholder="연락처 010-0000-0000">
    <input name="pw" type="password" required minlength="4" class="${IN}" placeholder="비밀번호 (4자리 이상)">
    <label class="text-xs font-bold block">세대 월패드 인증화면 사진 (필수)</label>
    <input name="img" type="file" accept="image/*" required class="text-xs">
    <label class="flex items-center gap-2 text-xs"><input name="agree" type="checkbox" required> 개인정보 수집·이용 동의 (목적: 실거주 승인)</label>
    <button class="${BTN}">가입 신청</button></form>`);
}

function submitRegister(e) {
  e.preventDefault();
  const g = n => e.target.elements[n];
  const nick = g('nick').value.trim();
  if (nick === ADMIN.id || [...approved, ...pending].some(u => u.nick === nick)) { alert('이미 사용 중인 닉네임입니다.'); return false; }
  readImg(g('img').files[0], img => {
    const newReg = { nick, pw: g('pw').value, name: g('name').value.trim(), phone: g('phone').value.trim(), dongHo: `${g('dong').value} ${g('ho').value.trim()}호`, img, role: 'resident', date: today() };
    if (db) db.collection('pending').add(newReg);
    pending.push(newReg); save('pending', pending); closeSheet();
    alert('가입 신청이 클라우드에 정상 접수되었습니다. 관리사무소 승인 후 로그인할 수 있습니다.');
  });
  return false;
}

function approve(i) {
  const u = pending[i];
  if (db && u.docId) db.collection('pending').doc(u.docId).delete();
  const approvedUser = { nick: u.nick, pw: u.pw, name: u.name, phone: u.phone, dongHo: u.dongHo, role: 'resident' };
  if (db) db.collection('approved').add(approvedUser);
  pending.splice(i, 1); approved.push(approvedUser);
  save('approved', approved); save('pending', pending); go('admin');
}

function changeRole(i, v) {
  const u = approved[i];
  u.role = v;
  if (db && u.docId) db.collection('approved').doc(u.docId).update({ role: v });
  save('approved', approved);
  if (user && user.nick === u.nick) { user.role = v; save('user', user); renderTop(); }
  go('admin');
}

function logout() { user = null; save('user', null); renderTop(); go('home'); }
function withdraw() {
  if (!confirm('탈퇴하시면 등록된 실명, 동·호수 등 모든 정보가 삭제됩니다. 진행할까요?')) return;
  const me = approved.find(u => u.nick === user.nick);
  if (db && me && me.docId) db.collection('approved').doc(me.docId).delete();
  approved = approved.filter(u => u.nick !== user.nick); save('approved', approved); logout();
}

function renderTop() {
  $('top-right').innerHTML = user
    ? `<button onclick="go('me')" class="text-xs bg-white/15 rounded-full px-3 py-1.5 font-bold">${esc(user.nick)} <span class="${(ROLE[user.role] || ROLE.resident)[1]} rounded px-1 text-[10px]">${(ROLE[user.role] || ROLE.resident)[0]}</span></button>`
    : `<button onclick="login()" class="text-xs bg-white text-blue-800 rounded-full px-3 py-1.5 font-bold">로그인</button>`;
}

function updNav() {
  const map = { res: 'more', laws: 'more', kapt: 'more', me: 'more', admin: 'more', chat: 'more' };
  const cur = map[tab] || tab;
  document.querySelectorAll('.nv').forEach(b => {
    const on = b.dataset.t === cur;
    b.classList.toggle('text-blue-700', on);
    b.classList.toggle('text-slate-400', !on);
  });
}

function go(t, push = true) {
  tab = t;
  if (push) history.pushState({ t }, '');
  $('view').innerHTML = (V[t] || V.home)();
  window.scrollTo(0, 0);
  updNav();
  const c = $('chatlog'); if (c) c.scrollTop = c.scrollHeight;
  try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
}

history.replaceState({ t: 'home' }, '');
renderTop();
initCloudSync();
go('home', false);
</script>
</body>
</html>
